name: kamgo_app
description: "KAM GO — Apni Ride, Apna Fare. A digital travel adda with fare negotiation."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^2.6.1
  go_router: ^14.6.2
  supabase_flutter: ^2.8.0
  flutter_animate: ^4.5.0
  shared_preferences: ^2.3.3
  url_launcher: ^6.3.1
  intl: any
  flutter_map: ^8.3.2
  latlong2: ^0.10.1
  geolocator: ^14.0.1
  connectivity_plus: ^6.1.0
  image_picker: ^1.2.3
  flutter_image_compress: ^2.5.1
  cached_network_image: ^4.0.4
  share_plus: ^13.3.1
  firebase_core: ^4.15.0
  firebase_messaging: ^16.7.0
  flutter_local_notifications: ^21.0.0
  http: ^1.6.0
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/logo/

  # Fonts are bundled (not fetched at runtime) so the app works fully offline.
  fonts:
    - family: Poppins
      fonts:
        - asset: assets/fonts/Poppins-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Poppins-Bold.ttf
          weight: 700
        - asset: assets/fonts/Poppins-ExtraBold.ttf
          weight: 800
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Variable.ttf
